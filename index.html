<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Fast INR to USD converter with live rates. Works offline.">
</head>
<body>
<title>Rupee Converter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f3d3a">
<style>
  /* Layout: one column, two big amount cards joined by a live-rate strip; thumb-reachable keys. */
  :root {
    --bg: #f3f6f5;
    --card: #ffffff;
    --ink: #10201e;
    --muted: #5b6e6b;
    --line: #d7e1df;
    --brand: #0f3d3a;
    --accent: #e8891c;
    --good: #1c8a5a;
    --warn: #b5650c;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1514; --card: #13211f; --ink: #e7f0ee; --muted: #93a7a3;
      --line: #24403c; --brand: #7fd1c3; --accent: #f3a54a; --good: #4cc48d; --warn: #f0a44a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1514; --card: #13211f; --ink: #e7f0ee; --muted: #93a7a3;
    --line: #24403c; --brand: #7fd1c3; --accent: #f3a54a; --good: #4cc48d; --warn: #f0a44a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 16px; -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 480px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; gap: 14px;
    padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: .01em; color: var(--brand); }
  .iconbtn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; height: 40px; padding: 0 14px; font: inherit; font-size: .9rem;
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  }
  .iconbtn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .iconbtn svg { width: 18px; height: 18px; }
  .spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .card.active { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .cardtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .code { font-weight: 700; font-size: .95rem; letter-spacing: .04em; }
  .code small { font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  select {
    font: inherit; font-weight: 700; font-size: .95rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; max-width: 60%;
  }
  .amount { display: flex; align-items: baseline; gap: 6px; }
  .sym { font-size: 1.6rem; color: var(--muted); font-weight: 600; }
  input.num {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 2.3rem; font-weight: 700; padding: 2px 0;
    font-variant-numeric: tabular-nums;
  }
  input.num::placeholder { color: var(--line); }
  .words { color: var(--muted); font-size: .85rem; min-height: 1.2em; font-variant-numeric: tabular-nums; }

  .rate {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 2px 4px; font-size: .92rem;
  }
  .rate b { font-variant-numeric: tabular-nums; }
  .pill { font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.live { color: var(--good); }
  .pill.old { color: var(--warn); }
  .pill.manual { color: var(--accent); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: .9rem;
    padding: 8px 12px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .chip:active { background: var(--bg); }

  .meta { color: var(--muted); font-size: .8rem; line-height: 1.45; display: flex; flex-direction: column; gap: 6px; }
  .meta button.link { background: none; border: 0; padding: 0; color: var(--brand); font: inherit; text-decoration: underline; cursor: pointer; }
  .manualbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .manualbox input {
    width: 8em; font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .manualbox button {
    font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--brand);
    background: var(--brand); color: var(--card); cursor: pointer;
  }
  .manualbox button.ghost { background: transparent; color: var(--brand); }
</style>

<main class="app">
  <header>
    <h1>Rupee Converter</h1>
    <button class="iconbtn" id="refresh" type="button" aria-label="Refresh exchange rate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>Refresh</span>
    </button>
  </header>

  <section class="card" id="cardA">
    <div class="cardtop"><span class="code">INR <small>Indian Rupee</small></span></div>
    <label class="amount" for="inr"><span class="sym">₹</span>
      <input class="num" id="inr" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Amount in Indian Rupees">
    </label>
    <div class="words" id="inrWords"></div>
  </section>

  <div class="rate">
    <span id="rateText">Loading rate…</span>
    <span class="pill" id="status" hidden></span>
  </div>

  <section class="card" id="cardB">
    <div class="cardtop">
      <select id="cur" aria-label="Other currency"></select>
    </div>
    <label class="amount" for="fx"><span class="sym" id="fxSym">$</span>
      <input class="num" id="fx" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Amount in other currency">
    </label>
    <div class="words" id="fxWords"></div>
  </section>

  <div class="chips" id="chips"></div>

  <div class="meta">
    <span id="source"></span>
    <span>Mid-market rate. Banks, cards and remittance apps usually add 1–3% on top.</span>
    <span><button class="link" id="manualToggle" type="button">Use my own rate</button></span>
    <div class="manualbox" id="manualBox" hidden>
      <span id="manualLabel">1 USD = ₹</span>
      <input id="manualRate" inputmode="decimal" autocomplete="off" aria-label="Custom rate in rupees">
      <button id="manualSave" type="button">Apply</button>
      <button id="manualClear" class="ghost" type="button">Use live rate</button>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";
  // Rates fetched on 20 Nov 2026 — used only until a live rate arrives (first open with no network).
  var BUILTIN = { base: "INR", date: "2026-11-20T00:02:32Z", src: "built-in",
    rates: { USD: 0.01071, EUR: 0.009758, GBP: 0.008165, AED: 0.039332, SAR: 0.040162, CAD: 0.015344,
             AUD: 0.016043, SGD: 0.013833, JPY: 1.713383, CHF: 0.009036, CNY: 0.071356, QAR: 0.038984,
             KWD: 0.003333, OMR: 0.004118, BHD: 0.004027, NZD: 0.019459, HKD: 0.084078, MYR: 0.04408,
             THB: 0.363782, PKR: 2.962241, BDT: 1.333441, NPR: 1.6, LKR: 3.56468 } };
  var CURRENCIES = [
    ["USD","US Dollar","$"],["EUR","Euro","€"],["GBP","British Pound","£"],["AED","UAE Dirham","AED"],
    ["SAR","Saudi Riyal","SAR"],["CAD","Canadian Dollar","C$"],["AUD","Australian Dollar","A$"],
    ["SGD","Singapore Dollar","S$"],["QAR","Qatari Riyal","QAR"],["KWD","Kuwaiti Dinar","KWD"],
    ["OMR","Omani Rial","OMR"],["BHD","Bahraini Dinar","BHD"],["JPY","Japanese Yen","¥"],
    ["CHF","Swiss Franc","CHF"],["CNY","Chinese Yuan","CN¥"],["HKD","Hong Kong Dollar","HK$"],
    ["NZD","New Zealand Dollar","NZ$"],["MYR","Malaysian Ringgit","RM"],["THB","Thai Baht","฿"],
    ["PKR","Pakistani Rupee","Rs"],["BDT","Bangladeshi Taka","৳"],["NPR","Nepalese Rupee","Rs"],["LKR","Sri Lankan Rupee","Rs"]
  ];
  var STALE_MS = 60 * 60 * 1000; // refresh if older than 1 hour

  var $ = function (id) { return document.getElementById(id); };
  var inrEl = $("inr"), fxEl = $("fx"), curEl = $("cur");
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

  var data = null;              // {rates (per 1 INR), date, src, fetched}
  var manual = null;            // {code, inrPerUnit}
  var cur = store("cur") || "USD";
  var lastEdited = "inr";
  try { data = JSON.parse(store("rates") || "null"); } catch (e) { data = null; }
  try { manual = JSON.parse(store("manual") || "null"); } catch (e) { manual = null; }
  if (!data || !data.rates || !data.rates.USD) data = BUILTIN;

  CURRENCIES.forEach(function (c) {
    var o = document.createElement("option"); o.value = c[0]; o.textContent = c[0] + " · " + c[1]; curEl.appendChild(o);
  });
  if (!CURRENCIES.some(function (c) { return c[0] === cur; })) cur = "USD";
  curEl.value = cur;

  function info(code) { for (var i = 0; i < CURRENCIES.length; i++) if (CURRENCIES[i][0] === code) return CURRENCIES[i]; return [code, code, code]; }

  // Units of `cur` per 1 INR
  function rate() {
    if (manual && manual.code === cur && manual.inrPerUnit > 0) return 1 / manual.inrPerUnit;
    var r = data.rates[cur]; return r > 0 ? r : null;
  }

  function parse(s) {
    s = String(s).replace(/[,\s₹$]/g, "");
    if (s === "" || s === ".") return null;
    var n = Number(s); return isFinite(n) ? n : null;
  }
  function fmtINR(n) { return n.toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
  function fmtFX(n) {
    var d = cur === "JPY" ? 0 : (Math.abs(n) < 1 && n !== 0 ? 4 : 2);
    return n.toLocaleString("en-US", { minimumFractionDigits: Math.min(d, 2), maximumFractionDigits: d });
  }
  function words(n) {
    if (n === null || !isFinite(n) || n < 1000) return "";
    var a = Math.abs(n);
    var trim = function (x) { return x.toLocaleString("en-IN", { maximumFractionDigits: 2 }); };
    if (a >= 1e7) return trim(n / 1e7) + " crore";
    if (a >= 1e5) return trim(n / 1e5) + " lakh";
    return trim(n / 1e3) + " thousand";
  }
  function wordsIntl(n) {
    if (n === null || !isFinite(n) || n < 1e3) return "";
    var t = function (x) { return x.toLocaleString("en-US", { maximumFractionDigits: 2 }); };
    if (n >= 1e9) return t(n / 1e9) + " billion";
    if (n >= 1e6) return t(n / 1e6) + " million";
    return t(n / 1e3) + " thousand";
  }

  // Keep typed text tidy: digits, one dot, live grouping commas.
  function tidy(el, locale) {
    var raw = el.value, caret = el.selectionStart;
    var digitsBefore = raw.slice(0, caret).replace(/[^\d.]/g, "").length;
    var clean = raw.replace(/[^\d.]/g, "");
    var dot = clean.indexOf(".");
    if (dot !== -1) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, "").slice(0, 4);
    var parts = clean.split(".");
    var intPart = parts[0].replace(/^0+(?=\d)/, "");
    var grouped = intPart ? Number(intPart).toLocaleString(locale) : (parts.length > 1 ? "0" : "");
    if (intPart.length > 15) grouped = intPart; // avoid float rounding on absurd lengths
    var out = grouped + (parts.length > 1 ? "." + parts[1] : "");
    el.value = out;
    var pos = 0, seen = 0;
    while (pos < out.length && seen < digitsBefore) { if (/[\d.]/.test(out[pos])) seen++; pos++; }
    try { el.setSelectionRange(pos, pos); } catch (e) {}
  }

  function compute() {
    var r = rate();
    var inr = parse(inrEl.value), fx = parse(fxEl.value);
    if (r) {
      if (lastEdited === "inr") {
        fx = inr === null ? null : inr * r;
        fxEl.value = fx === null ? "" : fmtFX(fx);
      } else {
        inr = fx === null ? null : fx / r;
        inrEl.value = inr === null ? "" : fmtINR(Math.round(inr * 100) / 100);
      }
    }
    $("inrWords").textContent = words(inr);
    $("fxWords").textContent = wordsIntl(fx);
    $("cardA").classList.toggle("active", lastEdited === "inr");
    $("cardB").classList.toggle("active", lastEdited === "fx");
    store("inrVal", lastEdited === "inr" ? (inrEl.value || "") : "");
  }

  function timeAgo(iso) {
    var d = new Date(iso); if (isNaN(d)) return "";
    var mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    var h = Math.round(mins / 60); if (h < 48) return h + " h ago";
    return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  }

  function renderRate() {
    var i = info(cur), r = rate();
    $("fxSym").textContent = i[2];
    $("manualLabel").textContent = "1 " + cur + " = ₹";
    var st = $("status");
    if (!r) { $("rateText").textContent = "No rate for " + cur + " yet. Tap Refresh."; st.hidden = true; return; }
    var inrPer = 1 / r;
    $("rateText").innerHTML = "";
    var b = document.createElement("b");
    b.textContent = "1 " + cur + " = ₹" + inrPer.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    $("rateText").appendChild(b);
    st.hidden = false;
    if (manual && manual.code === cur) {
      st.className = "pill manual"; st.textContent = "Your rate";
      $("source").textContent = "Using the rate you entered. Live rate: 1 " + cur + " = ₹" + (data.rates[cur] ? (1 / data.rates[cur]).toFixed(4) : "—") + ".";
    } else {
      var age = Date.now() - new Date(data.fetched || data.date).getTime();
      var fresh = data.src !== "built-in" && age < 26 * 3600 * 1000;
      st.className = "pill " + (fresh ? "live" : "old");
      st.textContent = fresh ? "Live" : "Saved rate";
      $("source").textContent = "Rate published " + timeAgo(data.date) + " · source: " + data.src +
        (data.fetched && data.src !== "built-in" ? " · checked " + timeAgo(data.fetched) : "");
    }
  }

  function renderChips() {
    var box = $("chips"); box.innerHTML = "";
    var amounts = [100, 500, 1000, 5000, 10000, 100000];
    amounts.forEach(function (a) {
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "chip";
      btn.textContent = "₹" + a.toLocaleString("en-IN");
      btn.addEventListener("click", function () { lastEdited = "inr"; inrEl.value = a.toLocaleString("en-IN"); compute(); });
      box.appendChild(btn);
    });
    [1, 10, 100].forEach(function (a) {
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "chip";
      btn.textContent = a + " " + cur;
      btn.addEventListener("click", function () { lastEdited = "fx"; fxEl.value = String(a); compute(); });
      box.appendChild(btn);
    });
  }

  // ---- live rates: three independent free sources, first success wins ----
  function getJSON(url, ms) {
    return new Promise(function (resolve, reject) {
      var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var t = setTimeout(function () { if (ctl) ctl.abort(); reject(new Error("timeout")); }, ms || 8000);
      fetch(url, { cache: "no-store", signal: ctl ? ctl.signal : undefined })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (j) { clearTimeout(t); resolve(j); }, function (e) { clearTimeout(t); reject(e); });
    });
  }
  var SOURCES = [
    function () { return getJSON("https://open.er-api.com/v6/latest/INR").then(function (j) {
      if (j.result !== "success" || !j.rates || !j.rates.USD) throw new Error("bad");
      return { rates: j.rates, date: new Date(j.time_last_update_unix * 1000).toISOString(), src: "ExchangeRate-API" }; }); },
    function () { return getJSON("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/inr.json")
      .catch(function () { return getJSON("https://latest.currency-api.pages.dev/v1/currencies/inr.json"); })
      .then(function (j) {
        if (!j.inr || !j.inr.usd) throw new Error("bad");
        var r = {}; Object.keys(j.inr).forEach(function (k) { r[k.toUpperCase()] = j.inr[k]; });
        return { rates: r, date: j.date + "T00:00:00Z", src: "Currency-API" }; }); },
    function () { return getJSON("https://api.frankfurter.app/latest?from=INR").then(function (j) {
      if (!j.rates || !j.rates.USD) throw new Error("bad");
      return { rates: j.rates, date: j.date + "T16:00:00Z", src: "ECB (Frankfurter)" }; }); }
  ];

  var loading = false;
  function refresh(force) {
    if (loading) return;
    if (!force && data.src !== "built-in" && data.fetched && Date.now() - new Date(data.fetched).getTime() < STALE_MS) return;
    loading = true; $("refresh").classList.add("spin");
    var i = 0;
    (function next() {
      if (i >= SOURCES.length) { done(false); return; }
      SOURCES[i++]().then(function (d) {
        d.fetched = new Date().toISOString();
        d.rates.INR = 1;
        data = d; store("rates", JSON.stringify(d)); done(true);
      }, next);
    })();
    function done(ok) {
      loading = false; $("refresh").classList.remove("spin");
      renderRate(); compute();
      if (!ok && force) $("source").textContent = "Couldn't reach the rate servers. Showing the last saved rate (" + timeAgo(data.date) + ").";
    }
  }

  // ---- events ----
  inrEl.addEventListener("input", function () { lastEdited = "inr"; tidy(inrEl, "en-IN"); compute(); });
  fxEl.addEventListener("input", function () { lastEdited = "fx"; tidy(fxEl, "en-US"); compute(); });
  inrEl.addEventListener("focus", function () { inrEl.select(); });
  fxEl.addEventListener("focus", function () { fxEl.select(); });
  curEl.addEventListener("change", function () {
    cur = curEl.value; store("cur", cur); renderRate(); renderChips(); compute();
  });
  $("refresh").addEventListener("click", function () { refresh(true); });
  $("manualToggle").addEventListener("click", function () {
    var box = $("manualBox"); box.hidden = !box.hidden;
    if (!box.hidden) { var r = rate(); $("manualRate").value = r ? (1 / r).toFixed(2) : ""; $("manualRate").focus(); }
  });
  $("manualSave").addEventListener("click", function () {
    var v = parse($("manualRate").value);
    if (!v || v <= 0) { $("manualRate").focus(); return; }
    manual = { code: cur, inrPerUnit: v }; store("manual", JSON.stringify(manual));
    $("manualBox").hidden = true; renderRate(); compute();
  });
  $("manualClear").addEventListener("click", function () {
    manual = null; store("manual", null); $("manualBox").hidden = true; renderRate(); compute();
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(false); });

  // ---- start ----
  var saved = store("inrVal");
  inrEl.value = saved || "1,000";
  renderRate(); renderChips(); compute();
  refresh(false);
  setInterval(function () { renderRate(); }, 60000);
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
